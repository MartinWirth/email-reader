<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Reader</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#202124}header{padding:20px 28px;background:#fff;border-bottom:1px solid #ddd}main{display:grid;grid-template-columns:230px minmax(650px,1fr) minmax(360px,1fr);max-width:1600px;margin:auto;background:#fff;min-height:calc(100vh - 81px)}aside{border-right:1px solid #ddd}.folders{padding:12px 8px}.folder{display:block;width:100%;padding:10px 12px;border:0;background:transparent;text-align:left;border-radius:7px;cursor:pointer;font:inherit}.folder:hover{background:#f1f3f4}.folder.active{background:#e8f0fe;font-weight:650}.folder-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mail-list{border-right:1px solid #ddd;overflow:auto}.search{margin:16px;width:calc(100% - 32px);padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.list-header,.item{display:grid;grid-template-columns:145px minmax(180px,1.4fr) minmax(180px,1.3fr) 95px 105px;gap:12px;align-items:center}.list-header{padding:8px 14px;background:#f7f7f8;border-top:1px solid #eee;border-bottom:1px solid #ddd;font-size:12px;font-weight:700;color:#666;text-transform:uppercase}.item{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px}.item:hover{background:#f4f7fb}.cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subject{font-weight:650}.date,.involved,.size,.attachments{color:#666}.attachments{display:flex;align-items:center;gap:5px}.attachment-icon{font-size:14px}.content{padding:30px;white-space:pre-wrap;line-height:1.55;overflow:auto}.muted{color:#777;padding:20px}.section-title{padding:12px 12px 4px;font-size:12px;font-weight:700;text-transform:uppercase;color:#777}@media(max-width:1250px){main{grid-template-columns:210px 1fr}.content{display:none}}@media(max-width:900px){main{grid-template-columns:190px 1fr}.mail-list{border-right:0}.list-header,.item{grid-template-columns:120px minmax(150px,1fr) minmax(140px,1fr) 80px 85px;gap:8px}}@media(max-width:600px){main{grid-template-columns:1fr}.folder-sidebar{display:none}.content{display:none}.list-header,.item{grid-template-columns:105px minmax(140px,1fr) minmax(120px,1fr) 70px 75px;font-size:11px;gap:6px;padding-left:8px;padding-right:8px}.search{margin:10px;width:calc(100% - 20px)}}
</style></head>
<body><header><strong>📧 Email Reader</strong></header><main>
<aside class="folder-sidebar"><div class="section-title">Folders</div><div id="folders" class="folders">Loading…</div></aside>
<section class="mail-list"><input id="search" class="search" placeholder="Search mail…"><div class="list-header"><div>Date / time</div><div>Subject</div><div>Involved</div><div>Size</div><div>Attachments</div></div><div id="list" class="muted">Loading…</div></section>
<section id="content" class="content"><span class="muted">Select an email.</span></section>
</main>
<script>
const folders=document.querySelector('#folders'),list=document.querySelector('#list'),content=document.querySelector('#content'),search=document.querySelector('#search');
let selectedFolder='INBOX';
async function loadFolders(){try{const r=await fetch('/api/folders');if(!r.ok)throw Error();const items=await r.json();folders.innerHTML=items.length?items.map((f,i)=>`<button class="folder ${f.name===selectedFolder?'active':''}" data-folder-index="${i}" title="${esc(f.name)}"><span class="folder-name">${esc(f.name)}</span></button>`).join(''):'<div class="muted">No folders.</div>';folders.querySelectorAll('.folder').forEach((button,i)=>button.addEventListener('click',()=>selectFolder(items[i].name)));}catch(e){folders.innerHTML='<div class="muted">Could not load folders.</div>'}}
async function selectFolder(name){selectedFolder=name;document.querySelectorAll('.folder').forEach(b=>b.classList.toggle('active',b.title===name));search.value='';content.innerHTML='<span class="muted">Select an email.</span>';await load('/api/emails?folder='+encodeURIComponent(name))}
async function load(url='/api/emails'){list.textContent='Loading…';try{const r=await fetch(url);if(!r.ok)throw Error();const items=await r.json();list.innerHTML=items.length?items.map(e=>`<div class="item" data-uid="${esc(e.uid)}" title="${esc(e.subject||'(no subject)')}"><div class="cell date">${esc(formatDate(e.date))}</div><div class="cell subject">${esc(e.subject||'(no subject)')}</div><div class="cell involved">${esc(e.involved||e.from||'')}</div><div class="cell size">${formatSize(e.size)}</div><div class="cell attachments">${e.attachments?.length?`<span class="attachment-icon">📎</span>${e.attachments.length}`:'—'}</div></div>`).join(''):'<div class="muted">No messages.</div>';list.querySelectorAll('.item').forEach(item=>item.addEventListener('click',()=>openMail(item.dataset.uid)));}catch(e){list.innerHTML='<div class="muted">Could not connect to mailbox.</div>'}}
async function openMail(uid){content.textContent='Loading…';const e=await fetch('/api/emails/'+encodeURIComponent(uid)+'?folder='+encodeURIComponent(selectedFolder)).then(r=>r.json());content.innerHTML=`<h2>${esc(e.subject||'(no subject)')}</h2><p><b>From:</b> ${esc(e.from)}<br><b>To:</b> ${esc(e.to)}<br><b>Date:</b> ${esc(e.date)}<br><b>Size:</b> ${formatSize(e.size)}<br><b>Attachments:</b> ${e.attachments?.length?e.attachments.map(a=>esc(a.filename||a.content_type)).join(', '):'None'}</p><hr><div>${esc(e.body||'')}</div>`}
function formatDate(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(d.getTime())?value:d.toLocaleString()}
function formatSize(bytes){if(bytes===null||bytes===undefined)return '—';if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';if(bytes<1024*1024*1024)return (bytes/(1024*1024)).toFixed(1)+' MB';return (bytes/(1024*1024*1024)).toFixed(1)+' GB'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{const q=search.value.trim();load(q?'/api/emails/search?q='+encodeURIComponent(q)+'&folder='+encodeURIComponent(selectedFolder):'/api/emails?folder='+encodeURIComponent(selectedFolder))},300)});loadFolders();load();
</script></body></html>
