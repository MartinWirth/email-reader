<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Reader</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#202124}header{padding:20px 28px;background:#fff;border-bottom:1px solid #ddd}main{display:grid;grid-template-columns:360px 1fr;max-width:1200px;margin:auto;background:#fff;min-height:calc(100vh - 81px)}aside{border-right:1px solid #ddd}button,input{font:inherit}input{margin:16px;width:calc(100% - 32px);padding:10px;border:1px solid #bbb;border-radius:8px}.item{padding:14px 18px;border-bottom:1px solid #eee;cursor:pointer}.item:hover{background:#f4f7fb}.subject{font-weight:650}.from,.date{font-size:12px;color:#666}.content{padding:30px;white-space:pre-wrap;line-height:1.55}.muted{color:#777;padding:20px}@media(max-width:700px){main{grid-template-columns:1fr}aside{border-right:0}.content{padding:20px}}
</style></head>
<body><header><strong>📧 Email Reader</strong></header><main><aside><input id="search" placeholder="Search mail…"><div id="list" class="muted">Loading…</div></aside><section id="content" class="content"><span class="muted">Select an email.</span></section></main>
<script>
const list=document.querySelector('#list'), content=document.querySelector('#content'), search=document.querySelector('#search');
async function load(url='/api/emails'){list.textContent='Loading…';try{const r=await fetch(url);if(!r.ok)throw Error();const items=await r.json();list.innerHTML=items.length?items.map(e=>`<div class="item" onclick="openMail('${e.uid}')"><div class="subject">${esc(e.subject||'(no subject)')}</div><div class="from">${esc(e.from)}</div><div class="date">${esc(e.date)}</div></div>`).join(''):'<div class="muted">No messages.</div>'}catch(e){list.innerHTML='<div class="muted">Could not connect to mailbox.</div>'}}
async function openMail(uid){content.textContent='Loading…';const e=await fetch('/api/emails/'+encodeURIComponent(uid)).then(r=>r.json());content.innerHTML=`<h2>${esc(e.subject||'(no subject)')}</h2><p><b>From:</b> ${esc(e.from)}<br><b>To:</b> ${esc(e.to)}<br><b>Date:</b> ${esc(e.date)}</p><hr><div>${esc(e.body||'')}</div>${e.attachments?.length?'<hr><b>Attachments:</b> '+e.attachments.map(a=>esc(a.filename||a.content_type)).join(', '):''}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{const q=search.value.trim();load(q?'/api/emails/search?q='+encodeURIComponent(q):'/api/emails')},300)});load();
</script></body></html>
