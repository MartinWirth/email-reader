<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Reader</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#202124}header{padding:20px 28px;background:#fff;border-bottom:1px solid #ddd}main{display:grid;grid-template-columns:230px 360px 1fr;max-width:1400px;margin:auto;background:#fff;min-height:calc(100vh - 81px)}aside{border-right:1px solid #ddd}.folders{padding:12px 8px}.folder{display:block;width:100%;padding:10px 12px;border:0;background:transparent;text-align:left;border-radius:7px;cursor:pointer;font:inherit}.folder:hover{background:#f1f3f4}.folder.active{background:#e8f0fe;font-weight:650}.folder-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mail-list{border-right:1px solid #ddd}.search{margin:16px;width:calc(100% - 32px);padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.item{padding:14px 18px;border-bottom:1px solid #eee;cursor:pointer}.item:hover{background:#f4f7fb}.subject{font-weight:650}.from,.date{font-size:12px;color:#666}.content{padding:30px;white-space:pre-wrap;line-height:1.55}.muted{color:#777;padding:20px}.section-title{padding:12px 12px 4px;font-size:12px;font-weight:700;text-transform:uppercase;color:#777}@media(max-width:900px){main{grid-template-columns:190px 1fr}.mail-list{display:none}}@media(max-width:600px){main{grid-template-columns:1fr}.folder-sidebar{display:none}.content{padding:20px}}
</style></head>
<body><header><strong>📧 Email Reader</strong></header><main>
<aside class="folder-sidebar"><div class="section-title">Folders</div><div id="folders" class="folders">Loading…</div></aside>
<aside class="mail-list"><input id="search" class="search" placeholder="Search mail…"><div id="list" class="muted">Loading…</div></aside>
<section id="content" class="content"><span class="muted">Select an email.</span></section>
</main>
<script>
const folders=document.querySelector('#folders'),list=document.querySelector('#list'),content=document.querySelector('#content'),search=document.querySelector('#search');
let selectedFolder='INBOX';
async function loadFolders(){try{const r=await fetch('/api/folders');if(!r.ok)throw Error();const items=await r.json();folders.innerHTML=items.length?items.map((f,i)=>`<button class="folder ${f.name===selectedFolder?'active':''}" data-folder-index="${i}" title="${esc(f.name)}"><span class="folder-name">${esc(f.name)}</span></button>`).join(''):'<div class="muted">No folders.</div>';folders.querySelectorAll('.folder').forEach((button,i)=>button.addEventListener('click',()=>selectFolder(items[i].name)));}catch(e){folders.innerHTML='<div class="muted">Could not load folders.</div>'}}
async function selectFolder(name){selectedFolder=name;document.querySelectorAll('.folder').forEach(b=>b.classList.toggle('active',b.title===name));search.value='';content.innerHTML='<span class="muted">Select an email.</span>';await load('/api/emails?folder='+encodeURIComponent(name))}
async function load(url='/api/emails'){list.textContent='Loading…';try{const r=await fetch(url);if(!r.ok)throw Error();const items=await r.json();list.innerHTML=items.length?items.map(e=>`<div class="item" data-uid="${esc(e.uid)}"><div class="subject">${esc(e.subject||'(no subject)')}</div><div class="from">${esc(e.from)}</div><div class="date">${esc(e.date)}</div></div>`).join(''):'<div class="muted">No messages.</div>';list.querySelectorAll('.item').forEach(item=>item.addEventListener('click',()=>openMail(item.dataset.uid)));}catch(e){list.innerHTML='<div class="muted">Could not connect to mailbox.</div>'}}
async function openMail(uid){content.textContent='Loading…';const e=await fetch('/api/emails/'+encodeURIComponent(uid)+'?folder='+encodeURIComponent(selectedFolder)).then(r=>r.json());content.innerHTML=`<h2>${esc(e.subject||'(no subject)')}</h2><p><b>From:</b> ${esc(e.from)}<br><b>To:</b> ${esc(e.to)}<br><b>Date:</b> ${esc(e.date)}</p><hr><div>${esc(e.body||'')}</div>${e.attachments?.length?'<hr><b>Attachments:</b> '+e.attachments.map(a=>esc(a.filename||a.content_type)).join(', '):''}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{const q=search.value.trim();load(q?'/api/emails/search?q='+encodeURIComponent(q)+'&folder='+encodeURIComponent(selectedFolder):'/api/emails?folder='+encodeURIComponent(selectedFolder))},300)});loadFolders();load();
</script></body></html>
